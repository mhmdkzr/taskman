global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'app'
    metrics_path: /metrics
    static_configs:
      - targets: ['app:8080']

  - job_name: 'caddy'
    metrics_path: /metrics
    static_configs:
      - targets: ['caddy:2019']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'nats'
    static_configs:
      - targets: ['nats-exporter:7777']

  - job_name: 'temporal'
    metrics_path: /metrics
    static_configs:
      - targets: ['temporal:8000']

  - job_name: 'zitadel'
    metrics_path: /debug/metrics
    static_configs:
      - targets: ['zitadel:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

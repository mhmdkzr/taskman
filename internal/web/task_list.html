{{define "taskList"}}<div id="task-list" class="board">
  {{range .Cols}}
  <div class="col">
    <div class="col-head">
      <span class="col-title">{{.Label}}</span>
      <span class="col-count">{{len .Tasks}}</span>
    </div>
    <div class="col-body">
      {{range .Tasks}}
      <div class="task" data-class:active="$selected == '{{.ID}}'"
           data-on:click="$selected = '{{.ID}}'; @get('/api/tasks/{{.ID}}')">
        <div class="row">
          <span class="badge {{.Status}}">{{.Status}}</span>
          <span class="title">{{.Title}}</span>
        </div>
        <div class="meta">{{.TaskType}} · {{shortID .ID}}{{if .CommitHash}} · {{shortHash .CommitHash}}{{end}}</div>
        {{if .Phase}}<div class="phase">{{.Phase}}</div>{{end}}
      </div>
      {{else}}
      <div class="empty">—</div>
      {{end}}
    </div>
  </div>
  {{end}}
</div>{{end}}

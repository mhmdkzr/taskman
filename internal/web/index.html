<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>taskman</title>
<style>
:root {
  --bg: #0b0e14;
  --bg2: #10151f;
  --bg3: #161c28;
  --border: #232b3a;
  --fg: #d5dbe6;
  --muted: #7b8698;
  --accent: #5ea1ff;
  --green: #4ec37c;
  --red: #e05561;
  --yellow: #d9a94e;
  --purple: #b48add;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  position: sticky;
  top: 0;
  z-index: 10;
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
header .dot.on { background: var(--green); }
header .dot.off { background: var(--red); }
header .status { color: var(--muted); font-size: 12px; }
header .count { color: var(--muted); font-size: 12px; margin-left: auto; }
.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 45px); }
.panel { overflow-y: auto; padding: 12px; }
.panel.left { border-right: 1px solid var(--border); background: var(--bg2); }
.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin: 0 0 8px; font-weight: 600;
}
.task { border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg3); cursor: pointer; }
.task:hover { border-color: var(--accent); }
.task.active { border-color: var(--accent); }
.task .row { display: flex; align-items: center; gap: 8px; }
.task .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .meta { color: var(--muted); font-size: 11px; margin-top: 4px; font-family: var(--mono); }
.task .phase { color: var(--accent); font-size: 11px; margin-top: 4px; }
.badge {
  display: inline-block; padding: 1px 7px; border-radius: 10px;
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
  background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
}
.badge.created { color: var(--muted); }
.badge.started { color: var(--yellow); border-color: var(--yellow); }
.badge.completed { color: var(--purple); border-color: var(--purple); }
.badge.reviewed { color: var(--green); border-color: var(--green); }
.badge.failed { color: var(--red); border-color: var(--red); }
.detail { max-width: 900px; }
.detail h2 { font-size: 16px; margin: 0 0 4px; }
.detail .spec h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; margin: 16px 0 4px; }
.detail .spec p { margin: 0 0 8px; white-space: pre-wrap; }
.detail .spec ul { margin: 0 0 8px; padding-left: 18px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.diff { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin: 8px 0; }
.diff .dfile { background: var(--bg3); padding: 6px 10px; font-family: var(--mono); font-size: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
.diff .dstat { color: var(--muted); font-size: 11px; }
.diff pre { margin: 0; padding: 10px; overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.45; }
.diff pre .add { background: rgba(78,195,124,0.12); }
.diff pre .del { background: rgba(224,85,97,0.12); }
.diff pre .hunk { color: var(--accent); }
.log { font-family: var(--mono); font-size: 12px; }
.log .entry { padding: 4px 6px; border-bottom: 1px solid rgba(35,43,58,0.5); white-space: pre-wrap; word-break: break-word; }
.log .entry .t { color: var(--muted); margin-right: 8px; }
.log .entry .s { color: var(--purple); margin-right: 8px; }
.log .entry.phase { border-left: 2px solid var(--accent); }
.log .entry.tool { border-left: 2px solid var(--yellow); }
.log .entry.err { border-left: 2px solid var(--red); }
.log .entry .in { color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: 100%; }
</style>
</head>
<body data-signals="{selected: ''}">

<header>
  <span class="dot"></span>
  <h1>taskman</h1>
  <span class="status">live</span>
</header>

<div class="layout" data-init="@get('/events', {openWhenHidden: true})">
  <div class="panel left">
    <div class="section-title">Tasks</div>
    <div id="task-list">
      {{template "taskList" .}}
    </div>
  </div>
  <div class="panel">
    <div id="detail" class="detail">
      <div class="empty">Select a task to see its spec, live activity and diff.</div>
    </div>
  </div>
</div>

<script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.3/bundles/datastar.js"></script>
</body>
</html>

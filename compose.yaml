services:
  caddy:
    image: caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:80
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    security_opt:
      - seccomp=unconfined
    expose:
      - 8080
    env_file:
      - .env
      - .env.compose
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:18.4-trixie@sha256:29ee7bb30d804447dc9a91fd0d74322ae1dc3a4072cc6346f70a5ed6e783b565
    env_file:
      - .env
      - .env.compose
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nats:
    image: nats:2.14.2-alpine3.22@sha256:b039b46715673a9436989cfc49dde04e6bd57e205347478a58214789baf5efdc
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./config/nats/nats.conf:/etc/nats/nats.conf:ro
    ports:
      - 127.0.0.1:4222:4222
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8222/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.29.7@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    env_file:
      - .env
      - .env.compose
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    ports:
      - 127.0.0.1:17233:7233
    volumes:
      - ./config/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-postgresql:
    image: postgres:18.4-trixie@sha256:29ee7bb30d804447dc9a91fd0d74322ae1dc3a4072cc6346f70a5ed6e783b565
    env_file:
      - .env
      - .env.compose
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.17.1@sha256:3ac6910685d48f32481f01f45e3e6215efe5a9df2c069591b481e9a101712db5
    restart: unless-stopped
    command: start-from-init --masterkeyFromEnv
    env_file:
      - .env
      - .env.compose
    depends_on:
      postgres:
        condition: service_healthy
      zitadel-bootstrap-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.17.1@sha256:8035df2409afb35a3999482ee98e453261715f98d47e4b62e948e4a1ddf4345f
    restart: unless-stopped
    env_file:
      - .env
      - .env.compose
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_healthy
    ports:
      - 127.0.0.1:3001:3000
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s

  zitadel-bootstrap-init:
    image: alpine:3.24
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /zitadel/bootstrap && chmod 755 /zitadel/bootstrap"]
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9@sha256:48f623f9c1e9b6cc44d77ca93634595ae99cce3246ded418763eb1a62eee45e9
    restart: unless-stopped
    entrypoint: ["tini", "--", "sh", "-c", "if [ ! -f /data/0_0.tigerbeetle ]; then echo 'tigerbeetle: formatting /data/0_0.tigerbeetle...'; /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle; fi; exec /tigerbeetle start --addresses=0.0.0.0:3000 --cache-grid=256MiB /data/0_0.tigerbeetle"]
    volumes:
      - tigerbeetle-data:/data
    ports:
      - 127.0.0.1:3000:3000
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK
    networks:
      default:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  tigerbeetle-init:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9@sha256:48f623f9c1e9b6cc44d77ca93634595ae99cce3246ded418763eb1a62eee45e9
    profiles: ["init"]
    entrypoint: ["sh", "-c", "if [ -f /data/0_0.tigerbeetle ]; then echo 'tigerbeetle: /data/0_0.tigerbeetle already exists, skipping format'; exit 0; fi; exec /tigerbeetle format --cluster=0 --replica=0 --replica-count=1 /data/0_0.tigerbeetle"]
    volumes:
      - tigerbeetle-data:/data
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  temporal-ui:
    image: temporalio/ui:2.51.0@sha256:5c72329a014fb247ef66d051dd45b3a5c251d06f82709a852e364f0fd8b69a04
    env_file:
      - .env
      - .env.compose
    depends_on:
      temporal:
        condition: service_healthy
    ports:
      - 127.0.0.1:8000:8080

  # node-exporter:
